version: "3.9"

services:
  db:
    image: postgis/postgis:18-3.6
    container_name: boardgamers-db
    restart: always
    environment:
      POSTGRES_DB: boardgamers
      POSTGRES_USER: bg_user
      POSTGRES_PASSWORD: bg_password
    ports:
      - "5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql

  web:
    build: .
    container_name: boardgamers-web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env_docker
    depends_on:
      - db

volumes:
  postgres18_data:
