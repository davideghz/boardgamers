{% load i18n %}
  {# ── Contributor banner ───────────────────────────────────────────── #}
  <div id="alert-container" class="hidden mb-6">
    <div class="flex items-center justify-between gap-3 rounded-xl border border-divider bg-surface px-4 py-3 text-sm text-content">
      <span>
        <strong>{% trans "Hey!" %}</strong> 🫵
        {% trans "Do you know your way around code and want to contribute to Board-Gamers?" %}
        <a href="{% url 'contacts' %}" class="text-blue-600 font-semibold hover:underline ml-1">{% trans "Contact us" %}</a> 😎
      </span>
      <button id="alert-close" type="button" class="flex-shrink-0 text-content-muted hover:text-content-soft transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const container = document.getElementById("alert-container");
      const closeBtn = document.getElementById("alert-close");
      const lastClosed = localStorage.getItem("alertClosedTimestamp");
      const hidden = lastClosed && (Date.now() - parseInt(lastClosed, 10)) < (24 * 60 * 60 * 1000);
      if (!hidden) container.classList.remove("hidden");
      closeBtn.addEventListener("click", function () {
        localStorage.setItem("alertClosedTimestamp", Date.now().toString());
        container.classList.add("hidden");
      });
    });
  </script>
