{% load i18n %}

<div class="flex gap-3 pt-2">
  <a href="{{ cancel_url }}"
     class="flex items-center justify-center gap-2 rounded-full border border-divider px-4 py-3 text-sm font-semibold text-content hover:bg-surface-alt transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
    {% trans "Cancel" %}
  </a>
  <button type="submit"
          class="flex flex-1 items-center justify-center gap-2 rounded-full bg-elevated px-4 py-3 text-sm font-bold text-white hover:bg-slate-700 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="h-4 w-4"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" /></svg>
    {{ submit_label }}
  </button>
</div>
