{% load i18n %}
{# Share the current page: native share sheet where available, else copy the link. #}
{# Params: share_title (required), share_label and share_class (optional, override the label and the button classes). #}
<button type="button" data-share-title="{{ share_title }}" data-copied-label="{% trans "Link copied!" %}"
        onclick="bgShare(this)"
        class="{{ share_class|default:'inline-flex items-center justify-center gap-1.5 w-full border border-divider text-content-soft text-sm font-semibold py-2.5 rounded-full hover:bg-surface-alt transition-colors' }}">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185z" /></svg>
  <span>{% if share_label %}{{ share_label }}{% else %}{% trans "Share" %}{% endif %}</span>
</button>
<script>
  window.bgShare = window.bgShare || function (btn) {
    const url = window.location.href.split('?')[0];
    if (navigator.share) {
      navigator.share({title: btn.dataset.shareTitle, url: url}).catch(() => {});
      return;
    }
    navigator.clipboard.writeText(url);
    const label = btn.querySelector('span');
    const original = label.textContent;
    label.textContent = btn.dataset.copiedLabel;
    setTimeout(() => { label.textContent = original; }, 2000);
  };
</script>
