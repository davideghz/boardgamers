{% load i18n %}
<a href="{{ url }}"
   class="group inline-flex items-center gap-2 -ml-1 mb-1 p-1 pr-3 rounded-xl max-w-full text-sm font-medium text-content-muted hover:text-content hover:bg-surface-input focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 transition-colors duration-200 text-decoration-none"
   aria-label="{% blocktrans with label=label %}Back to {{ label }}{% endblocktrans %}">
  <span class="flex items-center justify-center w-7 h-7 shrink-0 rounded-lg border border-divider bg-surface-input text-content-soft group-hover:bg-surface group-hover:text-content group-hover:shadow-sm transition-all duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 transition-transform duration-200 group-hover:-translate-x-0.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" /></svg>
  </span>
  <span class="truncate">{{ label }}</span>
</a>
