{% load i18n %}

<input type="hidden" name="location" id="location-filter-input" value="{{ selected_location }}">
{% if selected_location_obj %}
  <div class="sm:w-56 flex items-center gap-2 pl-2 pr-1 py-1.5 text-sm bg-surface border border-blue-500 rounded-xl">
    <img src="{{ selected_location_obj.cover_url }}" alt="" class="w-6 h-6 rounded-md object-cover flex-shrink-0">
    <button type="button" onclick="openLocationFilterModal()"
            class="flex-1 min-w-0 text-left font-semibold text-content truncate bg-transparent border-0 p-0 cursor-pointer">
      {{ selected_location_obj.name }}
    </button>
    <a href="{% querystring search_params|default:request.GET location=None page=None %}" aria-label="{% trans 'Remove filter' %}" title="{% trans 'Remove filter' %}"
       class="flex-shrink-0 p-1 rounded-lg text-content-muted hover:text-red-500 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" /></svg>
    </a>
  </div>
{% else %}
  <button type="button" onclick="openLocationFilterModal()"
          class="sm:w-56 flex items-center gap-2 py-2.5 px-3 text-sm text-content-muted bg-surface border border-divider rounded-xl hover:border-blue-400 hover:text-content transition-colors cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" class="w-4 h-4 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
    <span class="truncate">{% trans "All locations" %}</span>
  </button>
{% endif %}
