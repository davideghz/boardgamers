{% load i18n %}
{% with route=request.resolver_match.url_name %}
<ul class="flex flex-col gap-0.5 list-none">
  <li>
    <a href="{% url 'appointment-search' %}"
       data-label="{% trans 'Search' %}"
       {% if route == 'appointment-search' and search_type != 'events' %}aria-current="page"{% endif %}
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %} {% if route == 'appointment-search' and search_type != 'events' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans 'Search' %}</span>
    </a>
  </li>
  <li>
    <a href="{% url 'locations-index' %}"
       data-label="{% trans "Locations" %}"
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %}
              {% if route == 'locations-index' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans "Locations" %}</span>
    </a>
  </li>
  <li>
    <a href="{% url 'appointment-search' %}?type=events"
       data-label="{% trans "Events" %}"
       {% if route == 'appointment-search' and search_type == 'events' %}aria-current="page"{% endif %}
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %}
              {% if route == 'location-event-detail' or route == 'appointment-search' and search_type == 'events' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25m10.5-2.25v2.25M3 9h18M4.5 5.25h15A1.5 1.5 0 0 1 21 6.75v12a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.75v-12a1.5 1.5 0 0 1 1.5-1.5ZM7.5 13.5h.008m4.492 0h.008m4.492 0h.008m-9 3h.008m4.492 0h.008" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans "Events" %}</span>
    </a>
  </li>
  <li>
    <a href="{% url 'table-index' %}"
       data-label="{% trans "Tables" %}"
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %}
              {% if route == 'table-index' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans "Tables" %}</span>
    </a>
  </li>
  <li>
    <a href="{% url 'event-index' %}"
       data-label="{% trans "Manifestations" %}"
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %}
              {% if route == 'event-index' or route == 'event_detail' or route == 'event-program' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 9v7.5" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans "Manifestations" %}</span>
    </a>
  </li>
  <li>
    <a href="{% url 'game-list' %}"
       data-label="{% trans "Games" %}"
       class="{% if not mobile %}sidebar-nav-link {% endif %}flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium{% if not mobile %} transition-colors{% endif %}
              {% if route == 'game-list' or route == 'game-detail' %}bg-surface-input text-content font-semibold{% elif mobile %}text-content-soft hover:bg-surface-input{% else %}text-content-muted hover:bg-surface-input hover:text-content{% endif %}">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 flex-shrink-0"><path stroke-linecap="round" stroke-linejoin="round" d="M14.25 6.087c0-.355.186-.676.401-.959.221-.29.349-.634.349-1.003 0-1.036-1.007-1.875-2.25-1.875s-2.25.84-2.25 1.875c0 .369.128.713.349 1.003.215.283.401.604.401.959v0a.64.64 0 0 1-.657.643 48.39 48.39 0 0 1-4.163-.3c.186 1.613.293 3.25.315 4.907a.656.656 0 0 1-.658.663v0c-.355 0-.676-.186-.959-.401a1.647 1.647 0 0 0-1.003-.349c-1.036 0-1.875 1.007-1.875 2.25s.84 2.25 1.875 2.25c.369 0 .713-.128 1.003-.349.283-.215.604-.401.959-.401v0c.31 0 .555.26.532.57a48.039 48.039 0 0 1-.642 5.056c1.518.19 3.058.309 4.616.354a.64.64 0 0 0 .657-.643v0c0-.355-.186-.676-.401-.959a1.647 1.647 0 0 1-.349-1.003c0-1.035 1.008-1.875 2.25-1.875 1.243 0 2.25.84 2.25 1.875 0 .369-.128.713-.349 1.003-.215.283-.401.604-.401.959v0c0 .333.277.599.61.58a48.1 48.1 0 0 0 5.427-.63 48.05 48.05 0 0 0 .582-4.717.532.532 0 0 0-.533-.57v0c-.355 0-.676.186-.959.401-.29.221-.634.349-1.003.349-1.035 0-1.875-1.007-1.875-2.25s.84-2.25 1.875-2.25c.37 0 .713.128 1.003.349.283.215.604.401.959.401v0a.656.656 0 0 0 .658-.663 48.422 48.422 0 0 0-.37-5.36c-1.886.342-3.81.574-5.766.689a.578.578 0 0 1-.61-.58v0Z" /></svg>
      <span{% if not mobile %} class="sidebar-text"{% endif %}>{% trans "Games" %}</span>
    </a>
  </li>
</ul>
{% endwith %}
