{% load i18n %}

<a href="{{ event.get_absolute_url }}"
   class="flex items-center gap-3 rounded-xl border border-divider bg-surface p-3 hover:shadow-md transition-shadow">
  <img loading="lazy" decoding="async" src="{{ event.cover_url }}" alt=""
       class="h-20 w-20 shrink-0 rounded-xl border border-divider bg-surface-input object-cover">
  <div class="min-w-0 flex-1 space-y-1">
    {% if event.matching_date %}
      <p class="text-[10px] font-semibold uppercase tracking-wide text-content-muted">
        <time datetime="{{ event.matching_date|date:'Y-m-d' }}{% if event.matching_time %}T{{ event.matching_time|time:'H:i' }}{% endif %}">
          {{ event.matching_date|date:"D j M Y" }}{% if event.matching_time %} · {{ event.matching_time|time:"H:i" }}{% endif %}
        </time>
      </p>
    {% endif %}
    <p class="truncate text-sm font-bold text-content">{{ event.name }}</p>
    <p class="break-words text-xs text-content-muted">
      {{ event.get_kind_display }}{% if event.city %} · {{ event.city }}{% endif %}
    </p>
  </div>
</a>
