{% comment %}
Something waiting for a manager: a count, what it is and where to deal with it.
{% endcomment %}
<a href="{{ url }}"
   class="group flex items-center gap-3 rounded-xl border p-4 text-decoration-none transition-shadow hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focus
          {% if tone == 'info' %}border-primary/30 bg-primary/10{% else %}border-warning/30 bg-warning-soft{% endif %}">
  <span class="flex h-10 min-w-[2.5rem] flex-shrink-0 items-center justify-center rounded-xl bg-surface px-2 text-lg font-extrabold {% if tone == 'info' %}text-link{% else %}text-warning{% endif %}">{{ count }}</span>
  <span class="min-w-0 flex-1">
    <span class="block text-sm font-bold text-content">{{ title }}</span>
    {% if description %}<span class="mt-0.5 block text-xs text-content-soft">{{ description }}</span>{% endif %}
  </span>
  {% include "components/icon.html" with name="chevron-right" class="w-4 h-4 text-content-muted" only %}
</a>
